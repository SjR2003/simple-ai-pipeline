task_name: tuning

search_method: optuna # grid | random | optuna
n_trials: 5
metric: f1_score
direction: maximize

param_space:
  n_estimators:
    type: int
    low: 20
    high: 180
    step: 10
  max_depth:
    type: int
    low: 3
    high: 10
  learning_rate:
    type: float
    low: 0.0001
    high: 0.003
  epochs:
    type: int
    low: 50
    high: 600
    step: 50
  min_samples_leaf:
    type: int
    low: 5
    high: 60
    step: 5
  l2_regularization:
    type: float
    low: 0.0
    high: 1.0
  batch_size:
    type: int
    low: 4
    high: 32
    step: 4
  num_layers:
    type: int
    low: 2
    high: 4
  layer_size:
    type: int
    low: 16
    high: 64
    step: 16
  dropout_rate:
    type: float
    low: 0.05
    high: 0.4
